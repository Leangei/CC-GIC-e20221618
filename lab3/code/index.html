<!doctype html>
<html>
  <head>
    <title>Educative Webpage</title>
    <style>
      .flex-container {
        display: flex;
        background-color: #f2f2f2;
      }

      .flex-item {
        flex: 1;
        padding: 20px;
        text-align: center;
      }

      .image {
        max-width: 100%;
        max-height: 150px;
      }
    </style>
  </head>
  <body>
    <header
      style="
        background-color: #e05243;
        color: white;
        padding: 20px;
        text-align: center;
      "
    >
      <h2>Understanding AWS Storage Options - From Zero to Hero</h2>
    </header>

    <div style="padding: 20px">
      <h3>Hello from Educative!</h3>
    </div>

    <h2>AWS Storage Options</h2>

    <div class="flex-container">
      <div class="flex-item">
        <h3>Simple Storage Service (S3)</h3>
        <img
          src="https://www.educative.io/udata/cloudlab/X1YGqprb88o/AWS%20S3.png"
          alt="S3 Image"
          class="image"
        />
      </div>

      <div class="flex-item">
        <h3>Elastic Block Storage (EBS)</h3>
        <img
          src="https://www.educative.io/udata/cloudlab/W96bpqXEoEr/AWS-EBS.svg.png"
          alt="EBS Image"
          class="image"
        />
      </div>

      <div class="flex-item">
        <h3>Elastic File System (EFS)</h3>
        <img
          src="https://www.educative.io/udata/cloudlab/wMGnaVgQ7Yr/AWS-EFS.png"
          alt="EFS Image"
          class="image"
        />
      </div>
    </div>

    <footer
      style="
        background-color: #e05243;
        color: white;
        padding: 10px;
        text-align: center;
      "
    >
      © 2023 Educative
    </footer>
  </body>
</html>
